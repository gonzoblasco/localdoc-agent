[project]
name = "agente-local-amigo"
version = "0.1.0"
description = "Agente local y privado para un amigo real"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "sqlite-vec>=0.1.6",
    "smolagents>=1.2",
    "ollama>=0.4",
    "pypdf>=5.1",
    "markdownify>=0.13",
    "pyyaml>=6.0",
    "pytest>=9.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "httpx>=0.28"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "reportlab>=5.1.0",
]

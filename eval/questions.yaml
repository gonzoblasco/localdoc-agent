meta:
  version: 1
  corpus: data/demo/
  metrics:
    - answer_accuracy
    - citation_validity
    - refusal_correctness
    - p50_latency_ms
    - peak_ram_mb

questions:
  # --- Fáciles (6) ---
  - id: q01
    type: easy
    question: "¿Cuál es el monto total del contrato de Empresa Alpha?"
    expected: "$15.000,00"
    keywords: ["15.000"]
  - id: q02
    type: easy
    question: "¿Cuál es el monto total del contrato de Empresa Beta?"
    expected: "$8.400,00"
    keywords: ["8.400"]
  - id: q03
    type: easy
    question: "¿Cuál es la fecha del contrato de Empresa Alpha?"
    expected: "2026-01-10"
    keywords: ["2026-01-10"]
  - id: q04
    type: easy
    question: "¿Cuál es la fecha del contrato de Empresa Beta?"
    expected: "2026-03-05"
    keywords: ["2026-03-05"]
  - id: q05
    type: easy
    question: "¿Cuál es el total a pagar de la factura 2026-001?"
    expected: "$4.000,00"
    keywords: ["4.000"]
  - id: q06
    type: easy
    question: "¿A quién está dirigida la factura 2026-001?"
    expected: "Cliente Delta"
    keywords: ["delta"]

  # --- Multi-hop (6) ---
  - id: q07
    type: multi_hop
    question: "¿Cuál es la suma de los montos totales de los dos contratos?"
    expected: "$23.400,00"
    keywords: ["23.400"]
  - id: q08
    type: multi_hop
    question: "¿Qué contrato tiene mayor duración?"
    expected: "Empresa Beta (24 meses)"
    keywords: ["beta", "24"]
  - id: q09
    type: multi_hop
    question: "¿Qué cliente paga mensualmente?"
    expected: "Empresa Alpha"
    keywords: ["alpha"]
  - id: q10
    type: multi_hop
    question: "¿Qué cliente paga trimestralmente?"
    expected: "Empresa Beta"
    keywords: ["beta"]
  - id: q11
    type: multi_hop
    question: "¿Qué documento menciona una disponibilidad del 99,5%?"
    expected: "Contrato de Empresa Beta"
    keywords: ["beta", "99,5"]
  - id: q12
    type: multi_hop
    question: "¿Qué proveedor emite la factura 2026-001?"
    expected: "Empresa Gamma"
    keywords: ["gamma"]

  # --- Sin respuesta (3) ---
  - id: q13
    type: no_answer
    question: "¿Cuál es el teléfono de Empresa Alpha?"
    expected: "No está en los documentos"
    keywords: ["no", "encontr"]
  - id: q14
    type: no_answer
    question: "¿Cuántos empleados tiene Cliente Delta?"
    expected: "No está en los documentos"
    keywords: ["no", "encontr"]
  - id: q15
    type: no_answer
    question: "¿Cuál es el CUIT de Empresa Gamma?"
    expected: "No está en los documentos"
    keywords: ["no", "encontr"]

  # --- Números/fechas (3) ---
  - id: q16
    type: numeric
    question: "¿Cuántos meses dura el contrato de Empresa Alpha?"
    expected: "12 meses"
    keywords: ["12"]
  - id: q17
    type: numeric
    question: "¿Cuántos días hábiles hay para pagar la factura?"
    expected: "10 días hábiles"
    keywords: ["10"]
  - id: q18
    type: numeric
    question: "¿Cuál es el monto del soporte técnico en la factura?"
    expected: "$1.000,00"
    keywords: ["1.000"]
